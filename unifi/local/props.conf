[source::udp:5514]
TZ = America/Los_Angeles
EXTRACT-unifi_fw_prefix = \[(?<fw_chain>[A-Z_]+)-(?<fw_action_code>[A-Z])-(?<rule_id>\d+)\]
EXTRACT-unifi_fw_descr = DESCR="(?<rule>[^"]*)"
FIELDALIAS-unifi_fw = SRC AS src_ip SRC AS src DST AS dest_ip DST AS dest SPT AS src_port DPT AS dest_port IN AS src_interface OUT AS dest_interface host AS dvc
EVAL-action = case(fw_action_code=="A","allowed", fw_action_code=="D" OR fw_action_code=="B" OR fw_action_code=="R","blocked")
EVAL-direction = case(match(fw_chain,"^WAN_"),"inbound", match(fw_chain,"_WAN$"),"outbound", isnotnull(fw_chain),"internal")
EVAL-transport = case(PROTO=="2","igmp", isnotnull(PROTO),lower(PROTO))
EVAL-protocol = if(isnotnull(fw_chain),"ip",null())
EVAL-vendor_product = if(isnotnull(fw_chain),"Ubiquiti UniFi",null())
EVAL-wan = if(src_interface=="eth3" OR dest_interface=="eth3","WAN1",null())

