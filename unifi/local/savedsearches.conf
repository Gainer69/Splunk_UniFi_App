[UniFi - Build host lookup]
description = Builds unifi_hosts.csv (ip -> hostname, mac) from dnsmasq DHCPACK lines and UniFi CEF client events. Keeps entries seen in the last 90 days.
search = index=net source="udp:5514" (("dnsmasq-dhcp" "DHCPACK") OR ("CEF:" "UNIFIclientIp=")) \
| rex "DHCPACK\([^)]*\)\s+(?<d_ip>\d+\.\d+\.\d+\.\d+)\s+(?<d_mac>[0-9A-Fa-f:]{17})(?:\s+(?<d_name>\S+))?" \
| rex "UNIFIclientAlias=(?<c_alias>.+?)(?=\s+\w+=|$)" \
| rex "UNIFIclientHostname=(?<c_hn>\S+)" \
| rex "UNIFIclientIp=(?<c_ip>\d+\.\d+\.\d+\.\d+)" \
| rex "UNIFIclientMac=(?<c_mac>[0-9A-Fa-f:]{17})" \
| eval ip=coalesce(c_ip, d_ip), mac=lower(coalesce(c_mac, d_mac)), d_name=if(d_name=="*", null(), d_name) \
| where isnotnull(ip) \
| stats latest(c_alias) AS alias latest(c_hn) AS chn latest(d_name) AS dname latest(mac) AS mac max(_time) AS last_seen by ip \
| eval hostname=coalesce(alias, chn, dname), source=case(isnotnull(alias), "unifi_alias", isnotnull(chn), "unifi_hostname", isnotnull(dname), "dhcp") \
| where isnotnull(hostname) \
| table ip hostname mac source last_seen \
| inputlookup append=true unifi_hosts \
| sort 0 - last_seen \
| dedup ip \
| where last_seen > relative_time(now(), "-90d") \
| table ip hostname mac source last_seen \
| outputlookup unifi_hosts
dispatch.earliest_time = -24h@m
dispatch.latest_time = now
enableSched = 1
cron_schedule = */15 * * * *
schedule_window = 5
is_visible = 1
