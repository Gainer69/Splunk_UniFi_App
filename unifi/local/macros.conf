[unifi_port_service]
definition = eval service=case(dest_port==19,"chargen", dest_port==21,"FTP", dest_port==22,"SSH", dest_port==23 OR dest_port==2323,"Telnet", dest_port==25,"SMTP", dest_port==53,"DNS", dest_port==80,"HTTP", dest_port==110,"POP3", dest_port==123,"NTP", dest_port==135,"MS-RPC", dest_port==139,"NetBIOS", dest_port==143,"IMAP", dest_port==443,"HTTPS", dest_port==445,"SMB", dest_port==465,"SMTPS", dest_port==587,"SMTP-submission", dest_port==853,"DNS-over-TLS", dest_port==993,"IMAPS", dest_port==995,"POP3S", dest_port==1433,"MSSQL", dest_port==1723,"PPTP", dest_port==1883,"MQTT", dest_port==3306,"MySQL", dest_port==3389 OR dest_port==3390 OR dest_port==33890,"RDP", dest_port==5060,"SIP", dest_port==5432,"PostgreSQL", dest_port==5555,"ADB", dest_port==5900,"VNC", dest_port==6379,"Redis", dest_port==7547,"TR-069", dest_port==8080 OR dest_port==8008 OR dest_port==8888,"HTTP-alt", dest_port==8443 OR dest_port==4443,"HTTPS-alt", dest_port==9200,"Elasticsearch", dest_port==27017,"MongoDB", dest_port==2458 OR dest_port==2459,"Valheim", dest_port>=7777 AND dest_port<=7810,"Dune", dest_port==31982 OR dest_port==31983,"Dune RabbitMQ", true(),"-"), category=case(service=="SSH" OR service=="Telnet" OR service=="RDP" OR service=="VNC" OR service=="ADB","Remote access", service=="HTTP" OR service=="HTTPS" OR service=="HTTP-alt" OR service=="HTTPS-alt","Web", service=="MSSQL" OR service=="MySQL" OR service=="PostgreSQL" OR service=="Redis" OR service=="MongoDB" OR service=="Elasticsearch","Database", service=="SMTP" OR service=="SMTP-submission" OR service=="SMTPS" OR service=="POP3" OR service=="POP3S" OR service=="IMAP" OR service=="IMAPS","Mail", service=="SMB" OR service=="NetBIOS" OR service=="MS-RPC","Windows/SMB", service=="MQTT" OR service=="TR-069" OR service=="SIP" OR service=="chargen" OR service=="NTP" OR service=="DNS" OR service=="DNS-over-TLS" OR service=="PPTP" OR service=="FTP","Infrastructure/IoT", service=="Valheim" OR service=="Dune" OR service=="Dune RabbitMQ","Game servers", true(),"Other")
iseval = 0
description = Adds service and category fields based on dest_port (UniFi app)

[unifi_cef]
definition = rex "CEF:\d+\|[^|]*\|[^|]*\|[^|]*\|(?<cef_sig>[^|]*)\|(?<cef_name>[^|]*)\|(?<cef_severity>[^|]*)\|" | rex "UNIFIpolicyName=(?<policy_name>.+?)(?=\s+\w+=|$)" | rex "UNIFIsrcClientAlias=(?<src_client>.+?)(?=\s+\w+=|$)" | rex "UNIFIclientAlias=(?<client_alias>.+?)(?=\s+\w+=|$)" | rex "UNIFIvpnName=(?<vpn_name>.+?)(?=\s+\w+=|$)" | rex "UNIFIduration=(?<duration>.+?)(?=\s+\w+=|$)" | rex "UNIFIusageUp=(?<usage_up>.+?)(?=\s+\w+=|$)" | rex "UNIFIusageDown=(?<usage_down>.+?)(?=\s+\w+=|$)" | rex "UNIFIadmin=(?<admin>.+?)(?=\s+\w+=|$)" | rex "UNIFIsettingsSection=(?<settings_section>.+?)(?=\s+\w+=|$)" | rex "UNIFIsettingsEntry=(?<settings_entry>.+?)(?=\s+\w+=|$)" | rex "msg=(?<cef_msg>.+)$"
iseval = 0
description = Parses the UniFi CEF header (cef_sig, cef_name, cef_severity) and CEF fields whose values contain spaces (UniFi app)
